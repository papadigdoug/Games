<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Monkey Canon Croquet — Stage 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #111; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
  #rotateWarning {
    position: fixed; inset: 0; background: #1a1a2e; color: #fff; display: none;
    align-items: center; justify-content: center; flex-direction: column; z-index: 999; text-align: center; padding: 20px;
  }
  @media (orientation: portrait) {
    #rotateWarning { display: flex; }
    #gameWrap { display: none; }
  }
  #rotateWarning div { font-size: 48px; margin-bottom: 12px; }
  #gameWrap { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 10; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 10px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; color: #fff; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  #hud .stat { font-size: 15px; background: rgba(0,0,0,0.35); padding: 6px 12px; border-radius: 10px; margin-bottom: 6px; }
  #hud .stat span { color: #ffd166; }

  #powerBarWrap {
    position: absolute; left: calc(24px + env(safe-area-inset-left)); bottom: calc(40px + env(safe-area-inset-bottom));
    width: 200px; height: 20px; background: rgba(0,0,0,0.4); border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.5); display: none; overflow: hidden;
  }
  #powerBarFill { height: 100%; width: 0%; background: linear-gradient(90deg,#4ade80,#facc15,#f87171); }
  #sweetSpotZone {
    position: absolute; top: 0; right: 0; height: 100%; width: 8%;
    background: rgba(255,255,255,0.55); border-left: 2px solid #fff;
  }
  #perfectFlash {
    position: absolute; left: 24px; bottom: 66px; color: #ffd166; font-weight: 900;
    font-size: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); display: none;
  }

  #levelBanner {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-weight: 900; font-size: 24px; text-align: center;
    text-shadow: 0 3px 10px rgba(0,0,0,0.8); letter-spacing: 1px;
    opacity: 0; pointer-events: none; z-index: 60; transition: opacity 0.6s;
  }
  #levelBanner .sub { display: block; font-size: 13px; font-weight: 700; opacity: 0.85; margin-top: 4px; }

  #angleIndicator {
    position: absolute; width: 4px; height: 55px;
    background: rgba(255,255,255,0.85); transform-origin: bottom center;
    display: none; border-radius: 2px; pointer-events: none;
  }

  #swingBtn {
    position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    padding: 14px 34px; font-size: 18px; font-weight: 800; border: none; border-radius: 30px;
    background: #ff6b35; color: #fff; box-shadow: 0 4px 0 #c94f1f; letter-spacing: 0.5px;
  }
  #swingBtn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #c94f1f; }

  #instructions {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 13px; background: rgba(0,0,0,0.35); padding: 6px 14px; border-radius: 10px;
    text-align: center; pointer-events: none; max-width: 90%;
  }

  #resultPanel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(20,20,30,0.92); color: #fff; padding: 24px 32px; border-radius: 16px;
    text-align: center; display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #resultPanel h2 { font-size: 26px; margin-bottom: 10px; color: #ffd166; }
  #resultPanel p { font-size: 15px; margin-bottom: 16px; opacity: 0.85; }
  #resultPanel button {
    padding: 10px 24px; font-size: 15px; font-weight: 700; border: none; border-radius: 20px;
    background: #4ade80; color: #113311; margin: 0 6px; cursor: pointer;
  }

  #slots {
    position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 12px;
  }
  #activeEffects {
    position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom));
    color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.35); padding: 4px 10px; border-radius: 10px; display: none;
  }
  .slot {
    width: 66px; height: 66px; border-radius: 14px; background: rgba(0,0,0,0.5);
    border: 3px solid rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; touch-action: manipulation;
  }
  .slot.filled { border-color: #ffd166; }
  .slot.active { border-color: #4ade80; box-shadow: 0 0 10px #4ade80; }
  .slotIcon { font-size: 26px; z-index: 2; }
  .slotKey {
    position: absolute; top: 3px; left: 5px; font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.7); z-index: 2;
  }
  .slotTimer {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: rgba(74,222,128,0.4); z-index: 1;
  }

  #floatText {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none; font-weight: 900; font-size: 0; text-align: center;
    text-shadow: 0 3px 6px rgba(0,0,0,0.6); transition: none; z-index: 50;
  }
</style>
</head>
<body>

<div id="rotateWarning">
  <div>🔄</div>
  <div style="font-size:20px; font-weight:700;">Turn your phone sideways</div>
  <div style="font-size:14px; opacity:0.7; margin-top:6px;">This game is played in landscape</div>
</div>

<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div>
      <div class="stat">Distance: <span id="distStat">0</span> yds</div>
      <div class="stat">Level: <span id="tierStat">1</span>/5</div>
      <div class="stat">Wickets: <span id="wicketStat">0</span> &nbsp;|&nbsp; Smashes: <span id="smashStat">0</span></div>
    </div>
    <div>
      <div class="stat">Best: <span id="bestStat">0</span> yds</div>
      <div class="stat">Score: <span id="scoreStat">0</span></div>
      <div class="stat">Lives: <span id="livesStat">0</span> &nbsp;(<span id="wicketProgStat">0</span>/5)</div>
    </div>
  </div>

  <div id="slots">
    <div class="slot" id="slot0" data-slot="0"><span class="slotIcon"></span><div class="slotTimer"></div><span class="slotKey">1</span></div>
    <div class="slot" id="slot1" data-slot="1"><span class="slotIcon"></span><div class="slotTimer"></div><span class="slotKey">2</span></div>
    <div class="slot" id="slot2" data-slot="2"><span class="slotIcon"></span><div class="slotTimer"></div><span class="slotKey">3</span></div>
  </div>
  <div id="activeEffects"></div>

  <div id="floatText"></div>

  <div id="instructions">Tap SWING to start your backswing, drag up/down to aim, tap again to hit</div>

  <div id="angleIndicator"></div>
  <div id="powerBarWrap"><div id="powerBarFill"></div><div id="sweetSpotZone"></div></div>
  <div id="perfectFlash">PERFECT!</div>
  <div id="levelBanner"></div>

  <button id="swingBtn">SWING</button>

  <div id="resultPanel">
    <h2 id="resultTitle">Ball Stopped</h2>
    <p id="resultDetail">You hit it 0 yards.</p>
    <button id="tryAgainBtn">Swing Again</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const swingBtn = document.getElementById('swingBtn');
  const powerBarWrap = document.getElementById('powerBarWrap');
  const powerBarFill = document.getElementById('powerBarFill');
  const perfectFlash = document.getElementById('perfectFlash');
  const angleIndicator = document.getElementById('angleIndicator');
  const distStat = document.getElementById('distStat');
  const bestStat = document.getElementById('bestStat');
  const resultPanel = document.getElementById('resultPanel');
  const resultTitle = document.getElementById('resultTitle');
  const resultDetail = document.getElementById('resultDetail');
  const tryAgainBtn = document.getElementById('tryAgainBtn');
  const instructions = document.getElementById('instructions');
  const wicketStat = document.getElementById('wicketStat');
  const smashStat = document.getElementById('smashStat');
  const livesStat = document.getElementById('livesStat');
  const wicketProgStat = document.getElementById('wicketProgStat');
  const tierStat = document.getElementById('tierStat');
  const scoreStat = document.getElementById('scoreStat');
  const activeEffectsEl = document.getElementById('activeEffects');
  const levelBanner = document.getElementById('levelBanner');
  const slotEls = [document.getElementById('slot0'), document.getElementById('slot1'), document.getElementById('slot2')];
  const floatText = document.getElementById('floatText');

  let W, H, DPR;
  const gameWrapEl = document.getElementById('gameWrap');
  function resize() {
    DPR = window.devicePixelRatio || 1;
    const rect = gameWrapEl.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();

  // ---- World constants ----
  const GROUND_Y_RATIO = 0.72; // ground line as fraction of screen height (raised a bit to leave room for hill crests)
  const PIX_PER_YARD = 6;      // world scale: pixels per yard (zoomed in from 4.2 for readability)
  const GRAVITY = 2000;        // px/s^2
  const FRICTION_DECEL = 240;  // px/s^2 constant deceleration while rolling (middle ground)
  const BOUNCE_DAMP = 0.42;    // energy retained on bounce
  const MIN_ROLL_SPEED = 9;    // px/s below which we consider stopped
  const SPEED_MIN = 300;       // px/s launch speed at 0 power
  const SPEED_MAX = 880;       // px/s launch speed at 100 power (only reached on a PERFECT hit)
  const SWEET_SPOT_MIN = 92;   // power must be >= this to count as a perfect/max hit
  const MAX_SPEED = 950;       // px/s hard cap — prevents boosts/slopes from snowballing forever

  const LEVEL_LENGTH_YARDS = 1000;
  const LEVELS = [
    { name: 'Backyard', sky: ['#8a7bc8', '#e08bb0', '#f6a86b', '#fbd398'], ground: ['#8bc158', '#4f7d33'], cloud: 'rgba(255,224,150,0.9)' },
    { name: 'Belvadeer Forest — Day', sky: ['#7a5a9a', '#c98bb0', '#e8a86b', '#f6cf8e'], ground: ['#4a7a3e', '#2e5228'], cloud: 'rgba(220,190,240,0.75)' },
    { name: 'Belvadeer Forest — Night', sky: ['#0d0a26', '#241a4a', '#3a2a5e', '#4a3a6e'], ground: ['#233a24', '#132015'], cloud: 'rgba(150,140,190,0.35)' },
    { name: 'Trailer Park — Night', sky: ['#150f2e', '#2c1e4a', '#4a2e4e', '#6a3e4a'], ground: ['#4a4433', '#2e2a1e'], cloud: 'rgba(180,160,170,0.3)' },
    { name: 'BSM Layer — Sunrise', sky: ['#ff9d5c', '#ffc766', '#ffe29a', '#fff6d8'], ground: ['#c9a445', '#a67f2e'], cloud: 'rgba(255,255,255,0.9)' }
  ];
  // Level 5 has two sub-phases: a dim early sunrise for its first 500 yards, blending into a bright golden morning
  const LEVEL5_EARLY = { sky: ['#332a52', '#6a3f5e', '#a8584a', '#d9895c'], ground: ['#6e5f42', '#4c4028'], cloud: 'rgba(200,175,215,0.55)' };
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function lerpColor(hexA, hexB, t) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return `rgb(${r},${g},${bl})`;
  }
  function getTheme(levelIdx, yardsIntoLevel) {
    if (levelIdx !== 4) return LEVELS[levelIdx];
    const t = Math.max(0, Math.min(1, yardsIntoLevel / 500));
    const late = LEVELS[4];
    return {
      name: t < 1 ? 'BSM Layer — Early Sunrise' : 'BSM Layer — Golden Morning',
      sky: LEVEL5_EARLY.sky.map((c, i) => lerpColor(c, late.sky[i], t)),
      ground: LEVEL5_EARLY.ground.map((c, i) => lerpColor(c, late.ground[i], t)),
      cloud: late.cloud
    };
  }
  function levelIndexAt(yards) { return Math.max(0, Math.min(LEVELS.length - 1, Math.floor(yards / LEVEL_LENGTH_YARDS))); }
  let lastAnnouncedLevel = 0;
  let birdChirpTimer = 3 + Math.random() * 3;

  const TREE_SLOW_MULT = 0.9;      // 10% momentum loss per tree hit
  const WICKET_BOOST = 110;        // px/s added to vx on wicket pass
  const GNOME_SAFE_SPEED = 170;    // px/s — below this, gnome grabs the ball; at/above, it's smashed
  const NEAR_GROUND = 55;          // px above ground line counted as "on the ground" for collisions
  const RELISH_ACCEL = 650;        // px/s^2 forward push while Rocket Relish is active
  const RELISH_DURATION = 5;       // seconds added per power-up activation, stacks additively
  const POWERUP_DURATION = 5;      // seconds per activation, stacks additively (all 3 types)
  const MULCH_BONUS_SMASHES = 2;   // extra smash credit per gnome hit while Mulch Blaster is active
  const ENFUEO_WICKET_MULT = 1.6;  // wicket boost multiplier while Enfueo is active
  const MAX_SLOTS = 3;
  const SLOPE_ACCEL = 850;         // px/s^2 max — how strongly downhill/uphill slopes push or resist the ball
  let audioCtx = null;
  let musicPlaying = false;
  let musicInterval = null;
  let musicStep = 0;
  let nextStepTime = 0;
  const STEP_DUR = 60 / 92 / 4; // 92 BPM, 16th-note steps — boom-bap tempo
  const KICK_STEPS = [0, 3, 8, 11];
  const SNARE_STEPS = [4, 12];
  const HIHAT_STEPS = [0, 2, 4, 6, 8, 10, 12, 14];
  const BASS_PATTERN = [
    { step: 0, freq: 55.0 },   // A1
    { step: 6, freq: 55.0 },
    { step: 8, freq: 73.4 },   // D2
    { step: 14, freq: 65.4 }   // C2
  ];

  function playKick(time) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(42, time + 0.15);
    gain.gain.setValueAtTime(0.55, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.22);
  }
  function makeNoiseBuffer(durSec) {
    const size = Math.floor(audioCtx.sampleRate * durSec);
    const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }
  function playSnare(time) {
    const noise = audioCtx.createBufferSource();
    noise.buffer = makeNoiseBuffer(0.15);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1200;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.32, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(time);
    noise.stop(time + 0.15);
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = 190;
    const oGain = audioCtx.createGain();
    oGain.gain.setValueAtTime(0.18, time);
    oGain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
    osc.connect(oGain);
    oGain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.1);
  }
  function playHihat(time, accent) {
    const noise = audioCtx.createBufferSource();
    noise.buffer = makeNoiseBuffer(0.05);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 7500;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(accent ? 0.16 : 0.08, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(time);
    noise.stop(time + 0.05);
  }
  function playBassNote(time, freq) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.26);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.28);
  }
  function scheduleMusicStep(step, time) {
    if (KICK_STEPS.includes(step)) playKick(time);
    if (SNARE_STEPS.includes(step)) playSnare(time);
    if (HIHAT_STEPS.includes(step)) playHihat(time, step % 4 === 0);
    const bassNote = BASS_PATTERN.find(b => b.step === step);
    if (bassNote) playBassNote(time, bassNote.freq);
  }
  function musicScheduler() {
    if (!musicPlaying) return;
    while (nextStepTime < audioCtx.currentTime + 0.12) {
      scheduleMusicStep(musicStep, nextStepTime);
      nextStepTime += STEP_DUR;
      musicStep = (musicStep + 1) % 16;
    }
  }
  function startMusic() {
    if (musicPlaying) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      musicPlaying = true;
      musicStep = 0;
      nextStepTime = audioCtx.currentTime + 0.05;
      musicInterval = setInterval(musicScheduler, 50);
    } catch (e) {}
  }
  // music can only start after a user gesture (browser autoplay policy) — kick it off on the first tap anywhere

  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.value = vol || 0.15;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function generateCourse(startX) {
    courseObjects = [];
    const rand = seededRandom(Date.now() % 100000);
    let x = startX + 200; // clear runway before first obstacle
    const endX = startX + 5000 * PIX_PER_YARD; // full journey length, for testing difficulty ramp
    while (x < endX) {
      const yardsIn = (x - startX) / PIX_PER_YARD;
      const tier = Math.min(4, Math.floor(yardsIn / 1000)); // gets harder every 1000 yards, caps at tier 4

      const treeProbRaw = 0.28 + tier * 0.03;      // more trees as you go
      const wicketProbRaw = 0.27 - tier * 0.015;   // slightly fewer wickets to lean on later
      const gnomeProbRaw = 0.17 + tier * 0.02;     // more gnomes
      const powerupProbRaw = 1 - treeProbRaw - wicketProbRaw - gnomeProbRaw;
      const powerupProb = powerupProbRaw * 0.7; // 30% fewer power-ups overall
      const rescale = (1 - powerupProb) / (treeProbRaw + wicketProbRaw + gnomeProbRaw);
      const treeProb = treeProbRaw * rescale;
      const wicketProb = wicketProbRaw * rescale;
      const gnomeProb = gnomeProbRaw * rescale;

      const roll = rand();
      let type;
      if (roll < treeProb) type = 'tree';
      else if (roll < treeProb + wicketProb) type = 'wicket';
      else if (roll < treeProb + wicketProb + gnomeProb) type = 'gnome';
      else {

        const pu = rand();
        if (pu < 0.45) type = 'relish';
        else if (pu < 0.75) type = 'mulch';
        else type = 'enfueo';
      }

      courseObjects.push({ type, x, used: false });
      if (type === 'tree') {
        // guarantee a recovery chance: an Ancient Boost tree shortly after every regular tree
        const boostX = x + (10 + rand() * 8) * PIX_PER_YARD;
        courseObjects.push({ type: 'ancient', x: boostX, used: false });
      }
      const gapYards = (14 + rand() * 20) * (1 - tier * 0.04); // obstacles pack slightly tighter at higher tiers
      x += gapYards * PIX_PER_YARD;
    }

    // The finale: Golden Wicket at the very end of Level 5, Stake 200 yards beyond it
    const goldenWicketX = startX + 5500 * PIX_PER_YARD;
    const stakeX = startX + 6000 * PIX_PER_YARD;
    courseObjects.push({ type: 'golden_wicket', x: goldenWicketX, used: false });

  resetBall();

  function currentDistanceYards() {
    return Math.max(0, (ball.x - ball.startX) / PIX_PER_YARD);
  }

  function updateHud() {
    distStat.textContent = currentDistanceYards().toFixed(1);
    bestStat.textContent = best.toFixed(1);
    wicketStat.textContent = wicketsPassed;
    smashStat.textContent = gnomesSmashed;
    livesStat.textContent = lives;
    wicketProgStat.textContent = wicketProgress;
    const curLevel = levelIndexAt(currentDistanceYards());
    tierStat.textContent = curLevel + 1;
    scoreStat.textContent = score;
    if (curLevel !== lastAnnouncedLevel && (state === STATE.FLYING || state === STATE.ROLLING)) {
      lastAnnouncedLevel = curLevel;
      showLevelBanner(curLevel);
    }
  }

  function showLevelBanner(idx) {
    levelBanner.innerHTML = `LEVEL ${idx + 1}<span class="sub">${LEVELS[idx].name}</span>`;
    levelBanner.style.opacity = '1';
    setTimeout(() => { levelBanner.style.opacity = '0'; }, 1800);
  }

  // ---- Input handling ----
  function beginCharge() {
    if (state !== STATE.IDLE && state !== STATE.STOPPED) return;
    resetBall();
    state = STATE.CHARGING;
    power = 0;
    powerDir = 1;
    powerBarWrap.style.display = 'block';
    angleIndicator.style.display = 'block';
    instructions.textContent = 'Drag up/down to aim — tap HIT right as the bar fills the white zone for max power';
    swingBtn.textContent = 'HIT';
    resultPanel.style.display = 'none';
  }

  function releaseSwing() {
    if (state !== STATE.CHARGING) return;
    let speedFrac;
    const isPerfect = power >= SWEET_SPOT_MIN;
    if (isPerfect) {
      speedFrac = 1;
      perfectFlash.style.display = 'block';
      setTimeout(() => { perfectFlash.style.display = 'none'; }, 900);
    } else {
      // steep falloff so only a near-perfect release approaches max speed
      speedFrac = Math.pow(power / SWEET_SPOT_MIN, 1.8) * 0.7;
    }
    const launchSpeed = SPEED_MIN + speedFrac * (SPEED_MAX - SPEED_MIN); // px/s
    const rad = angleDeg * Math.PI / 180;
    ball.vx = Math.cos(rad) * launchSpeed;
    ball.vy = -Math.sin(rad) * launchSpeed;
    state = STATE.FLYING;
    playLiftSound();
    powerBarWrap.style.display = 'none';
    angleIndicator.style.display = 'none';
    instructions.textContent = '';
    startSwingSequence();
  }

  // ---- Brent swing animation controller ----
  function startSwingSequence() {
    animSequence = {
      frames: ['downswing', 'impact', 'follow_through'],
      durations: [0.05, 0.09, 0.22],
      elapsed: 0,
      index: 0
    };
  }
  function updateSwingAnim(dt) {
    if (!animSequence) return;
    animSequence.elapsed += dt;
    if (animSequence.elapsed >= animSequence.durations[animSequence.index]) {
      animSequence.elapsed = 0;
      animSequence.index++;
      if (animSequence.index >= animSequence.frames.length) animSequence = null;
    }
  }
  function currentBrentFrameKey() {
    if (animSequence) return animSequence.frames[animSequence.index];
    if (state === STATE.CHARGING) {
      if (power < 25) return 'focus';
      if (power < 60) return 'backswing_start';
      return 'backswing_high';
    }
    if (state === STATE.FLYING || state === STATE.ROLLING) return 'watch_ball';
    if (state === STATE.STOPPED) return 'relaxed_stand';
    return 'idle';
  }

  swingBtn.addEventListener('click', () => {
    if (state === STATE.IDLE || state === STATE.STOPPED) beginCharge();
    else if (state === STATE.CHARGING) releaseSwing();
  });

  tryAgainBtn.addEventListener('click', () => {
    resultPanel.style.display = 'none';
    state = STATE.IDLE;
    resetBall();
    swingBtn.textContent = 'SWING';
    instructions.textContent = 'Tap SWING to start your backswing, drag up/down to aim, tap again to hit';
    updateHud();
  });

  function pointerDown(clientY) {
    if (state === STATE.CHARGING) {
      dragStartY = clientY;
      dragStartAngle = angleDeg;
    }
  }
  function pointerMove(clientY) {
    if (state === STATE.CHARGING && dragStartY !== null) {
      const dy = dragStartY - clientY; // dragging up increases angle
      let newAngle = dragStartAngle + dy * 0.25;
      newAngle = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, newAngle));
      angleDeg = newAngle;
    }
  }
  function pointerUp() { dragStartY = null; }

  canvas.addEventListener('mousedown', e => pointerDown(e.clientY));
  canvas.addEventListener('mousemove', e => pointerMove(e.clientY));
  window.addEventListener('mouseup', pointerUp);
  canvas.addEventListener('touchstart', e => { pointerDown(e.touches[0].clientY); }, { passive: true });
  canvas.addEventListener('touchmove', e => { pointerMove(e.touches[0].clientY); }, { passive: true });
  canvas.addEventListener('touchend', pointerUp);

  // ---- Physics update ----
  let lastTime = performance.now();

  function update(rawDt) {
    timeScale += (timeScaleTarget - timeScale) * Math.min(1, rawDt * 8);
    const dt = rawDt * timeScale;

    if (levelIndexAt(currentDistanceYards()) === 4 && (state === STATE.FLYING || state === STATE.ROLLING)) {
      birdChirpTimer -= rawDt;
      if (birdChirpTimer <= 0) {
        playBirdChirp();
        birdChirpTimer = 3 + Math.random() * 4;
      }
    }

    if (state === STATE.CHARGING) {
      power += powerDir * 110 * dt;
      if (power >= 100) { power = 100; powerDir = -1; }
      if (power <= 0) { power = 0; powerDir = 1; }
      powerBarFill.style.width = power + '%';
      const ballScreenX = worldToScreenX(ball.x);
      const ballScreenY = worldToScreenY(ball.y - 8); // anchor at ball center (radius 8)
      angleIndicator.style.left = ballScreenX + 'px';
      angleIndicator.style.bottom = (H - ballScreenY) + 'px';
      angleIndicator.style.transform = `rotate(${90 - angleDeg}deg)`;
    }

    const prevBallX = ball.x;

    // tick down active power-up timers
    for (const key of ['relish', 'mulch', 'enfueo']) {
      if (effectRemaining[key] > 0) {
        effectRemaining[key] = Math.max(0, effectRemaining[key] - dt);
      }
    }
    // Rocket Relish gives a continuous forward push while active, plus a rocket exhaust trail
    if (effectRemaining.relish > 0 && (state === STATE.FLYING || state === STATE.ROLLING)) {
      ball.vx += RELISH_ACCEL * dt;
      ball.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vx));
      relishSpawnTimer -= dt;
      if (relishSpawnTimer <= 0) {
        relishSpawnTimer = 0.02;
        const dir = ball.vx >= 0 ? -1 : 1;
        const ex = ball.x + dir * 10;
        const ey = ball.y - 8 + (Math.random() - 0.5) * 6;
        const evx = dir * (120 + Math.random() * 80);
        const col = Math.random() < 0.5 ? '#ff8c1a' : '#ffd166';
        spawnParticle(ex, ey, evx, (Math.random() - 0.5) * 60, 0.28, col, 2.5 + Math.random() * 1.5);
      }
    }
    // Mulch Blaster shoots wood-chip debris out from the ball while active
    if (effectRemaining.mulch > 0 && (state === STATE.FLYING || state === STATE.ROLLING)) {
      mulchSpawnTimer -= dt;
      if (mulchSpawnTimer <= 0) {
        mulchSpawnTimer = 0.13;
        for (let i = 0; i < 3; i++) {
          const evx = (Math.random() - 0.5) * 220;
          const evy = -140 - Math.random() * 90;
          const col = Math.random() < 0.5 ? '#6b4a2a' : '#4a7a3e';
          spawnParticle(ball.x, ball.y - 8, evx, evy, 0.45 + Math.random() * 0.25, col, 2 + Math.random() * 2);
        }
      }
    }
    updateParticles(dt);
    updateSlotUI();
    updateSwingAnim(dt);

    if (state === STATE.FLYING) {
      ball.vy += GRAVITY * dt;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      ball.rot += (ball.vx / PIX_PER_YARD) * dt * 0.12;

      const groundHere = groundYAt(ball.x);
      if (ball.y >= groundHere) {
        ball.y = groundHere;
        if (Math.abs(ball.vy) > 60) {
          ball.vy = -ball.vy * BOUNCE_DAMP;
        } else {
          ball.vy = 0;
          state = STATE.ROLLING;
          playLandSound();
        }
      }
    } else if (state === STATE.ROLLING) {
      // slope pushes/resists based on downhill (+slope) or uphill (-slope) in direction of travel
      const slope = terrainSlope(ball.x);
      ball.vx += slope * SLOPE_ACCEL * dt;
      ball.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vx));
      ball.x += ball.vx * dt;
      ball.y = groundYAt(ball.x);
      const decel = FRICTION_DECEL * dt;
      if (ball.vx > 0) ball.vx = Math.max(0, ball.vx - decel);
      else if (ball.vx < 0) ball.vx = Math.min(0, ball.vx + decel);
      ball.rot += (ball.vx / PIX_PER_YARD) * dt * 0.12;
      if (Math.abs(ball.vx) < MIN_ROLL_SPEED) {
        ball.vx = 0;
        finishShot();
      }
    }

    if ((state === STATE.FLYING || state === STATE.ROLLING) && ball.y >= groundYAt(ball.x) - NEAR_GROUND) {
      checkCollisions(prevBallX, ball.x);
    }

    if (state === STATE.FLYING || state === STATE.ROLLING) {
      ballTrail.push({ x: ball.x, y: ball.y });
      if (ballTrail.length > 14) ballTrail.shift();
    } else if (ballTrail.length) {
      ballTrail.shift();
    }

    // camera zoom-follows the ball, tracking both x and terrain-following y
    const camLerp = Math.min(1, dt * 7);
    camFocusX += (ball.x - camFocusX) * camLerp;
    camFocusY += (ball.y - camFocusY) * camLerp;

    // hard safety clamp: guarantees the ball can never visually exit the viewport,
    // even during sudden impulses (Ancient Boost, wicket, relish) that outrun the smoothing above
    const marginXFrac = Math.min(CAM_ANCHOR_X_FRAC, 1 - CAM_ANCHOR_X_FRAC) * 0.8;
    const marginYFrac = Math.min(CAM_ANCHOR_Y_FRAC, 1 - CAM_ANCHOR_Y_FRAC) * 0.8;
    const maxOffX = (W * marginXFrac) / ZOOM;
    const maxOffY = (H * marginYFrac) / ZOOM;
    camFocusX = Math.max(ball.x - maxOffX, Math.min(ball.x + maxOffX, camFocusX));
    camFocusY = Math.max(ball.y - maxOffY, Math.min(ball.y + maxOffY, camFocusY));

    updateHud();
  }

  function checkCollisions(prevX, newX) {
    for (const obj of courseObjects) {
      if (obj.used) continue;
      if (obj.x >= prevX && obj.x <= newX) {
        obj.used = true;
        handleObjectHit(obj);
      }
    }
  }

  function handleObjectHit(obj) {
    if (obj.type === 'tree') {
      ball.vx *= TREE_SLOW_MULT;
      showFloatText('SLOWED', '#f87171', obj.x);
      beep(180, 0.12, 'sawtooth', 0.1);
    } else if (obj.type === 'wicket') {
      ball.vx += WICKET_BOOST * (ball.vx >= 0 ? 1 : -1);
      ball.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, ball.vx));
      wicketsPassed++;
      wicketProgress++;
      lastWicketX = obj.x;
      if (effectRemaining.enfueo > 0) score += 30;
      if (wicketProgress >= 5) {
        wicketProgress = 0;
        if (lives < 3) lives++;
        showFloatText('EXTRA LIFE!', '#4ade80', obj.x);
      } else {
        showFloatText(effectRemaining.enfueo > 0 ? 'WICKET +30!' : 'WICKET!', effectRemaining.enfueo > 0 ? '#ff6b35' : '#ffd166', obj.x);
      }
      beep(660, 0.12, 'sine', 0.12);
    } else if (obj.type === 'gnome') {
      const speed = Math.abs(ball.vx);
      if (speed >= GNOME_SAFE_SPEED) {
        gnomesSmashed++;
        const bonus = (effectRemaining.mulch > 0 || effectRemaining.enfueo > 0) ? 50 : 0;
        if (bonus) { score += bonus; showFloatText(`SMASH! +${bonus}`, '#ff6b35', obj.x); }
        else showFloatText('SMASH!', '#ff6b35', obj.x);
        timeScaleTarget = 0.08; // near-freeze so the smash is actually visible
        playGnomeScream();
        setTimeout(() => { playGnomeSmash(); }, 300);
        setTimeout(() => { timeScaleTarget = 1; }, 950);
      } else {
        if (lives > 0) {
          lives--;
          showFloatText('GRABBED! -1 LIFE', '#f87171', obj.x);
          beep(140, 0.3, 'square', 0.15);
          ball.x = lastWicketX;
          ball.y = groundY();
          ball.vx = 250;
          ball.vy = 0;
          state = STATE.ROLLING;
        } else {
          showFloatText('GRABBED!', '#f87171', obj.x);
          beep(110, 0.4, 'square', 0.18);
          ball.vx = 0;
          finishShot(true);
        }
      }
    } else if (obj.type === 'relish' || obj.type === 'mulch' || obj.type === 'enfueo') {
      const emptySlot = slots.indexOf(null);
      const labels = { relish: 'RELISH!', mulch: 'MULCH BLASTER!', enfueo: 'ENFUEO!' };
      const colors = { relish: '#facc15', mulch: '#4ade80', enfueo: '#ff6b35' };
      if (emptySlot !== -1) {
        slots[emptySlot] = obj.type;
        showFloatText(labels[obj.type], colors[obj.type], obj.x);
        beep(440, 0.1, 'triangle', 0.12);
      } else {
        showFloatText('WASTED', '#999', obj.x);
      }
      updateSlotUI();
    } else if (obj.type === 'ancient') {
      ball.vx += 260;
      ball.vy = -1450;
      state = STATE.FLYING;
      playLiftSound();
      showFloatText('ANCIENT BOOST!', '#ffd166', obj.x);
      beep(520, 0.22, 'triangle', 0.18);
      setTimeout(() => beep(760, 0.18, 'triangle', 0.14), 90);
    } else if (obj.type === 'golden_wicket') {
      wicketsPassed++;
      ball.vx = Math.max(ball.vx, 0) + 1300; // uncapped — guarantees covering the 500-yard gap to the stake
      showFloatText('GOLDEN WICKET!', '#ffd166', obj.x);
      beep(880, 0.3, 'triangle', 0.22);
      setTimeout(() => beep(1180, 0.28, 'triangle', 0.2), 140);
      timeScaleTarget = 0.35;
      setTimeout(() => { timeScaleTarget = 1; }, 500);
    } else if (obj.type === 'stake') {
      ball.vx = 0;
      finishShot(false, true);
    }
  }

  function showFloatText(text, color, worldX) {
    floatText.textContent = text;
    floatText.style.color = color;
    floatText.style.fontSize = '26px';
    floatText.style.opacity = '1';
    floatText.style.top = '38%';
    clearTimeout(showFloatText._t);
    showFloatText._t = setTimeout(() => {
      floatText.style.transition = 'opacity 0.4s, top 0.4s';
      floatText.style.opacity = '0';
      floatText.style.top = '30%';
    }, 500);
    setTimeout(() => { floatText.style.transition = 'none'; floatText.style.fontSize = '0px'; }, 950);
  }

  const ICONS = { relish: '🚀', mulch: '💥', enfueo: '🔥' };

  function updateSlotUI() {
    slots.forEach((s, i) => {
      const el = slotEls[i];
      const icon = el.querySelector('.slotIcon');
      const timer = el.querySelector('.slotTimer');
      if (s) {
        el.classList.add('filled');
        icon.textContent = ICONS[s];
      } else {
        el.classList.remove('filled');
        icon.textContent = '';
      }
      timer.style.height = '0%'; // per-slot timer retired in favor of the active-effects readout
      el.classList.remove('active');
    });
    updateActiveEffectsUI();
  }

  function updateActiveEffectsUI() {
    const parts = [];
    for (const key of ['relish', 'mulch', 'enfueo']) {
      if (effectRemaining[key] > 0) {
        parts.push(`${ICONS[key]} ${effectRemaining[key].toFixed(1)}s`);
      }
    }
    activeEffectsEl.textContent = parts.join('   ');
    activeEffectsEl.style.display = parts.length ? 'block' : 'none';
  }

  function activateSlot(i) {
    const type = slots[i];
    if (type) {
      effectRemaining[type] += RELISH_DURATION;
      slots[i] = null;
      updateSlotUI();
    }
  }
  slotEls.forEach((el, i) => {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); activateSlot(i); });
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === '1') activateSlot(0);
    else if (e.key === '2') activateSlot(1);
    else if (e.key === '3') activateSlot(2);
  });

  function finishShot(grabbed, won) {
    state = STATE.STOPPED;
    const dist = currentDistanceYards();
    if (dist > best) best = dist;
    if (won) {
      resultTitle.textContent = '🏆 THE GREATEST SHOT EVER! 🏆';
      resultDetail.textContent = `You made it all ${dist.toFixed(1)} yards! ${wicketsPassed} wickets, ${gnomesSmashed} smashes, ${score} bonus points.`;
      beep(660, 0.15, 'triangle', 0.2);
      setTimeout(() => beep(880, 0.15, 'triangle', 0.2), 130);
      setTimeout(() => beep(1100, 0.3, 'triangle', 0.22), 260);
    } else if (grabbed) {
      resultTitle.textContent = 'Grabbed by a Belvadere!';
      resultDetail.textContent = `Run over — you made it ${dist.toFixed(1)} yards.`;
    } else {
      resultTitle.textContent = dist > 40 ? 'Nice Shot!' : 'Ball Stopped';
      resultDetail.textContent = `You hit it ${dist.toFixed(1)} yards. ${wicketsPassed} wickets, ${gnomesSmashed} smashes.`;
    }
    resultPanel.style.display = 'block';
    swingBtn.textContent = 'SWING';
  }

  // ---- Rendering ----
  function draw() {
    ctx.clearRect(0, 0, W, H);

    const camYards = (camFocusX - ball.startX) / PIX_PER_YARD;
    const levelIdx = levelIndexAt(camYards);
    const yardsIntoLevel = camYards - levelIdx * LEVEL_LENGTH_YARDS;
    const theme = getTheme(levelIdx, yardsIntoLevel);

    // sky background — flat, screen-space, not zoomed — themed per level
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, theme.sky[0]);
    skyGrad.addColorStop(0.35, theme.sky[1]);
    skyGrad.addColorStop(0.65, theme.sky[2]);
    skyGrad.addColorStop(1, theme.sky[3]);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W * CAM_ANCHOR_X_FRAC, H * CAM_ANCHOR_Y_FRAC);
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-camFocusX, -camFocusY);

    // visible world x-range at current zoom/focus, with margin
    const worldLeft = camFocusX - (W * CAM_ANCHOR_X_FRAC) / ZOOM - 80;
    const worldRight = camFocusX + (W * (1 - CAM_ANCHOR_X_FRAC)) / ZOOM + 80;

    // clouds — sit high above the ground, so a big Ancient Boost launch visibly passes above them
    const cloudBandY = baseGroundY() - 480;
    const cloudSpacing = 340;
    ctx.fillStyle = theme.cloud;
    const firstCloud = Math.floor(worldLeft / cloudSpacing) * cloudSpacing;
    for (let cx = firstCloud; cx <= worldRight; cx += cloudSpacing) {
      const cy = cloudBandY + Math.sin(cx / 500) * 40;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 42, 16, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 30, cy + 6, 30, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 28, cy + 8, 28, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // terrain-following ground shape
    ctx.beginPath();
    ctx.moveTo(worldLeft, camFocusY + 2000);
    const step = 14;
    for (let wx = worldLeft; wx <= worldRight; wx += step) {
      ctx.lineTo(wx, groundYAt(wx));
    }
    ctx.lineTo(worldRight, camFocusY + 2000);
    ctx.closePath();
    const gGrad = ctx.createLinearGradient(0, baseGroundY() - 50, 0, baseGroundY() + 300);
    gGrad.addColorStop(0, theme.ground[0]);
    gGrad.addColorStop(1, theme.ground[1]);
    ctx.fillStyle = gGrad;
    ctx.fill();

    if (levelIdx === 1 || levelIdx === 2) drawForestBackdrop(worldLeft, worldRight, levelIdx);

    // yard markers every 100 yards, following terrain height
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '12px Segoe UI, Arial';
    ctx.textAlign = 'center';
    const startWorldX = ball.startX;
    for (let yd = 0; yd <= 5000; yd += 100) {
      const worldX = startWorldX + yd * PIX_PER_YARD;
      if (worldX < worldLeft || worldX > worldRight) continue;
      const gy = groundYAt(worldX);
      ctx.fillRect(worldX - 1, gy - 10, 2, 10);
      ctx.fillText(yd + 'y', worldX, gy - 14);
    }

    // course objects
    for (const obj of courseObjects) {
      if (obj.x < worldLeft || obj.x > worldRight) continue;
      drawCourseObject(obj);
    }

    // Backyard scene — house, oak tree with tire swing, fence — anchors Level 1's setting near the launch point
    if (ball.startX - worldLeft > -650) drawBackyardScene(ball.startX);

    // placeholder character near start
    drawCharacterPlaceholder(ball.startX - 26, groundYAt(ball.startX));

    // ball
    drawParticles();
    drawBall(ball.x, ball.y);

    ctx.restore();
  }

  function drawForestBackdrop(worldLeft, worldRight, levelIdx) {
    const isNight = levelIdx === 2;
    const treeSpacing = 95;
    const firstTree = Math.floor(worldLeft / treeSpacing) * treeSpacing;
    for (let tx = firstTree; tx <= worldRight; tx += treeSpacing) {
      const gy = groundYAt(tx);
      const seed = Math.sin(tx * 12.9898) * 43758.5453;
      const frac = seed - Math.floor(seed);
      const h = 130 + frac * 90;
      const trunkW = 10 + frac * 6;
      ctx.save();
      ctx.translate(tx, gy);
      ctx.fillStyle = isNight ? '#14211a' : '#3a4a2e';
      ctx.fillRect(-trunkW / 2, -h * 0.4, trunkW, h * 0.4);
      ctx.fillStyle = isNight ? '#1c3324' : '#3f6b34';
      ctx.beginPath();
      ctx.arc(0, -h * 0.4, h * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // mushroom clusters, sparser
    const mushSpacing = 260;
    const firstMush = Math.floor(worldLeft / mushSpacing) * mushSpacing;
    for (let mx = firstMush; mx <= worldRight; mx += mushSpacing) {
      const seed = Math.sin(mx * 7.233) * 12345.678;
      const frac = seed - Math.floor(seed);
      if (frac < 0.4) continue; // not every spacing slot gets a cluster
      const gy = groundYAt(mx);
      ctx.save();
      ctx.translate(mx, gy);
      const capColor = isNight ? '#8a6fd8' : '#b06fd8';
      for (let i = 0; i < 3; i++) {
        const ox = (i - 1) * 8;
        ctx.fillStyle = '#e8dcc8';
        ctx.fillRect(ox - 1.5, -10, 3, 9);
        ctx.fillStyle = capColor;
        ctx.beginPath();
        ctx.ellipse(ox, -12, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        if (isNight) {
          ctx.fillStyle = 'rgba(200,180,255,0.6)';
          ctx.beginPath();
          ctx.arc(ox, -12, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // one log tunnel near the start of this level, and a squirrel in a nearby tree
    const levelStartX = ball.startX + levelIdx * LEVEL_LENGTH_YARDS * PIX_PER_YARD;
    const tunnelX = levelStartX + 220;
    if (tunnelX > worldLeft - 100 && tunnelX < worldRight + 100) {
      const gy = groundYAt(tunnelX);
      ctx.save();
      ctx.translate(tunnelX, gy);
      ctx.fillStyle = isNight ? '#2a1c10' : '#4a3018';
      ctx.beginPath();
      ctx.ellipse(0, -16, 26, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = isNight ? '#0a0805' : '#1a1006';
      ctx.beginPath();
      ctx.ellipse(0, -16, 16, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    const squirrelX = levelStartX + 60;
    if (squirrelX > worldLeft - 40 && squirrelX < worldRight + 40) {
      const gy = groundYAt(squirrelX) - 150;
      ctx.save();
      ctx.translate(squirrelX, gy);
      ctx.fillStyle = '#8a5a2e';
      ctx.beginPath();
      ctx.ellipse(0, 0, 8, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(7, -6, 6, 8, 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBackyardScene(startX) {
    const gY = groundYAt(startX);

    // fence line behind the launch point
    ctx.save();
    ctx.translate(startX - 60, gY);
    ctx.strokeStyle = '#8a6a45';
    ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      const px = -i * 22 - 20;
      ctx.beginPath();
      ctx.moveTo(px, -2);
      ctx.lineTo(px, -34);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-130, -28); ctx.lineTo(-18, -28);
    ctx.moveTo(-130, -14); ctx.lineTo(-18, -14);
    ctx.stroke();
    ctx.restore();

    // house silhouette, set back and to the right of the launch point
    ctx.save();
    ctx.translate(startX + 110, gY);
    // body
    ctx.fillStyle = '#8fbfae';
    ctx.fillRect(-60, -110, 120, 90);
    // roof
    ctx.fillStyle = '#5f7d6f';
    ctx.beginPath();
    ctx.moveTo(-72, -110);
    ctx.lineTo(0, -155);
    ctx.lineTo(72, -110);
    ctx.closePath();
    ctx.fill();
    // door
    ctx.fillStyle = '#4a3b2a';
    ctx.fillRect(-12, -55, 22, 45);
    // window
    ctx.fillStyle = '#cfe8e0';
    ctx.fillRect(-45, -95, 22, 22);
    ctx.fillRect(20, -95, 22, 22);
    ctx.restore();

    // oak tree with tire swing, to the left of the launch point
    ctx.save();
    ctx.translate(startX - 170, gY);
    ctx.strokeStyle = '#5c4326';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-6, -95);
    ctx.stroke();
    ctx.fillStyle = '#4d7a34';
    ctx.beginPath();
    ctx.arc(-6, -140, 62, 0, Math.PI * 2);
    ctx.fill();
    // tire swing rope
    ctx.strokeStyle = '#3a2c1a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(10, -110);
    ctx.lineTo(18, -55);
    ctx.stroke();
    // tire
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.ellipse(18, -42, 13, 15, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // dirt patches on the ground, scattered around the yard
    ctx.save();
    ctx.fillStyle = 'rgba(120,90,55,0.45)';
    const dirtSpots = [-230, -80, 40, 160, 260];
    dirtSpots.forEach((dx, i) => {
      const dgy = groundYAt(startX + dx);
      ctx.beginPath();
      ctx.ellipse(startX + dx, dgy - 1, 26 + (i % 3) * 6, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // telephone poles with wire, set back behind the scene
    [-20, 200].forEach(dx => {
      const px = startX + dx;
      const pgy = groundYAt(px);
      ctx.save();
      ctx.translate(px, pgy);
      ctx.strokeStyle = '#5a4630';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -140);
      ctx.stroke();
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-16, -128); ctx.lineTo(16, -128);
      ctx.stroke();
      ctx.restore();
    });
    ctx.save();
    ctx.strokeStyle = 'rgba(40,30,20,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(startX - 20, groundYAt(startX - 20) - 268);
    ctx.quadraticCurveTo(startX + 90, groundYAt(startX + 90) - 240, startX + 200, groundYAt(startX + 200) - 268);
    ctx.stroke();
    ctx.restore();

    // chicken coop, near the tree
    ctx.save();
    ctx.translate(startX - 230, gY);
    ctx.fillStyle = '#a89478';
    ctx.fillRect(-26, -46, 52, 40);
    ctx.fillStyle = '#6b5a44';
    ctx.beginPath();
    ctx.moveTo(-32, -46); ctx.lineTo(0, -66); ctx.lineTo(32, -46);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2a2015';
    ctx.fillRect(-8, -26, 14, 20);
    ctx.restore();

    // a couple chickens pecking near the coop
    [-260, -195].forEach(dx => {
      const cgy = groundYAt(startX + dx);
      ctx.save();
      ctx.translate(startX + dx, cgy);
      ctx.fillStyle = '#f2ede0';
      ctx.beginPath();
      ctx.ellipse(0, -8, 8, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e0435a';
      ctx.beginPath();
      ctx.arc(6, -13, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // rusty old tractor, foreground left
    ctx.save();
    ctx.translate(startX - 90, gY);
    ctx.fillStyle = '#a8502e';
    ctx.fillRect(-24, -38, 40, 20);
    ctx.fillStyle = '#7a3a20';
    ctx.beginPath();
    ctx.moveTo(-24, -38); ctx.lineTo(-14, -54); ctx.lineTo(16, -54); ctx.lineTo(16, -38);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(-16, -8, 11, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(14, -6, 7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // woodpile near the house
    ctx.save();
    ctx.translate(startX + 155, gY);
    ctx.fillStyle = '#7a5a38';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.ellipse(i * 9 - 14, -8 - (i % 2) * 7, 9, 7, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // scattered spare tires
    [-40, 20].forEach(dx => {
      const tgy = groundYAt(startX + dx);
      ctx.save();
      ctx.translate(startX + dx, tgy);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(0, -8, 12, 6, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    // dog resting near the porch
    ctx.save();
    ctx.translate(startX + 70, gY);
    ctx.fillStyle = '#c8965a';
    ctx.beginPath();
    ctx.ellipse(0, -10, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(14, -14, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // garden bed, set out to the right
    ctx.save();
    ctx.translate(startX + 250, gY);
    ctx.fillStyle = '#7a5a38';
    ctx.fillRect(-30, -22, 60, 16);
    ctx.fillStyle = '#4d7a34';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(-24 + i * 12, -24, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#f2ede0';
    ctx.fillRect(-26, -10, 52, 10);
    ctx.fillStyle = '#2a2015';
    ctx.font = 'bold 6px Segoe UI, Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GARDEN OF PINCHAVEN', 0, -3);
    ctx.restore();
  }

  function drawCourseObject(obj) {
    const gY = groundYAt(obj.x);
    if (obj.used && obj.type !== 'tree') return; // trees stay visible even after slowing you (still an obstacle visually)
    if (obj.type === 'tree') {
      ctx.save();
      ctx.translate(obj.x, gY);
      ctx.globalAlpha = obj.used ? 0.55 : 1;
      ctx.fillStyle = '#7a4a2b';
      ctx.fillRect(-4, -22, 8, 22);
      ctx.fillStyle = '#3f8f3f';
      ctx.beginPath();
      ctx.arc(0, -34, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (obj.type === 'wicket') {
      ctx.save();
      ctx.translate(obj.x, gY);
      ctx.strokeStyle = obj.used ? '#999' : '#e5e5e5';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-9, 0); ctx.lineTo(-9, -20);
      ctx.moveTo(9, 0); ctx.lineTo(9, -20);
      ctx.stroke();
      ctx.strokeStyle = obj.used ? '#666' : '#e0435a';
      ctx.beginPath();
      ctx.moveTo(-9, -20); ctx.lineTo(9, -20);
      ctx.stroke();
      ctx.restore();
    } else if (obj.type === 'gnome') {
      const gnomeTier = levelIndexAt((obj.x - ball.startX) / PIX_PER_YARD);
      const img = gnomeTierImages[gnomeTier];
      if (img && img.complete && img.naturalHeight > 0) {
        const targetH = 78;
        const scale = targetH / img.naturalHeight;
        const w = img.naturalWidth * scale;
        ctx.drawImage(img, obj.x - w / 2, gY - targetH, w, targetH);
      } else {
        ctx.save();
        ctx.translate(obj.x, gY);
        ctx.fillStyle = '#4a7c3f';
        ctx.beginPath();
        ctx.arc(0, -12, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.moveTo(-11, -18); ctx.lineTo(11, -18); ctx.lineTo(0, -34); ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    } else if (obj.type === 'relish' || obj.type === 'mulch' || obj.type === 'enfueo') {
      ctx.save();
      ctx.translate(obj.x, gY - 14);
      const bob = Math.sin(performance.now() / 220 + obj.x) * 3;
      ctx.translate(0, bob);
      const pickupStyle = {
        relish: { color: '#ff8c1a', label: 'RR' },
        mulch: { color: '#4ade80', label: 'MB' },
        enfueo: { color: '#ff3b3b', label: 'EF' }
      }[obj.type];
      ctx.fillStyle = pickupStyle.color;
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText(pickupStyle.label, 0, 3);
      ctx.restore();
    } else if (obj.type === 'ancient') {
      ctx.save();
      ctx.translate(obj.x, gY);
      const glow = 0.6 + Math.sin(performance.now() / 260) * 0.3;
      ctx.globalAlpha = glow;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(0, -36, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#8a5a1f';
      ctx.fillRect(-5, -22, 10, 22);
      ctx.fillStyle = '#ffe08a';
      ctx.beginPath();
      ctx.arc(0, -36, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (obj.type === 'golden_wicket') {
      ctx.save();
      ctx.translate(obj.x, gY);
      const glow = 0.7 + Math.sin(performance.now() / 200) * 0.3;
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 14 * glow;
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-13, 0); ctx.lineTo(-13, -30);
      ctx.moveTo(13, 0); ctx.lineTo(13, -30);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-13, -30); ctx.lineTo(13, -30);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 9px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('GOLDEN', 0, -40);
      ctx.restore();
    } else if (obj.type === 'stake') {
      ctx.save();
      ctx.translate(obj.x, gY);
      ctx.fillStyle = '#6a4a2a';
      ctx.fillRect(-4, -70, 8, 70);
      ctx.fillStyle = '#3a2a17';
      ctx.beginPath();
      ctx.moveTo(-4, -70); ctx.lineTo(0, -80); ctx.lineTo(4, -70);
      ctx.closePath();
      ctx.fill();
      // skull-logo pennant, echoing the BSM branding from the title art
      ctx.fillStyle = '#d81f2f';
      ctx.beginPath();
      ctx.moveTo(4, -68); ctx.lineTo(34, -60); ctx.lineTo(4, -52);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('BSM', 16, -57);
      ctx.restore();
    }
  }

  function drawCharacterPlaceholder(x, gY) {
    if (currentCharacter === 'brent') {
      const key = currentBrentFrameKey();
      const img = brentSwingImages[key] || brentSwingImages['idle'];
      if (img && img.complete && img.naturalHeight > 0) {
        const targetH = 115;
        const scale = targetH / img.naturalHeight;
        const w = img.naturalWidth * scale;
        ctx.drawImage(img, x - w / 2, gY - targetH, w, targetH);
        return;
      }
    }
    const img = spriteImages[currentCharacter];
    if (img && img.complete && img.naturalHeight > 0) {
      const targetH = 100;
      const scale = targetH / img.naturalHeight;
      const w = img.naturalWidth * scale;
      ctx.drawImage(img, x - w / 2, gY - targetH, w, targetH);
      return;
    }
    // fallback blob while sprite image is still loading
    ctx.save();
    ctx.translate(x, gY);
    ctx.fillStyle = '#2b3a67';
    ctx.beginPath();
    ctx.ellipse(0, -34, 12, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8b98a';
    ctx.beginPath();
    ctx.arc(0, -62, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a4a7a';
    ctx.fillRect(-9, -14, 7, 16);
    ctx.fillRect(2, -14, 7, 16);
    ctx.restore();
  }

  function drawBall(x, y) {
    const r = 8;
    const speed = Math.hypot(ball.vx, ball.vy);
    const speedFrac = Math.min(1, speed / 900); // 0-1 sense-of-speed scale

    // motion trail
    for (let i = 0; i < ballTrail.length; i++) {
      const t = ballTrail[i];
      const age = i / ballTrail.length; // 0 = oldest, 1 = newest
      ctx.save();
      ctx.globalAlpha = age * 0.25 * speedFrac;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(t.x, t.y - r, r * (0.5 + age * 0.4), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // speed streak lines when moving fast
    if (speedFrac > 0.35) {
      const dir = ball.vx >= 0 ? -1 : 1;
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${0.15 + speedFrac * 0.35})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const off = (i - 1.5) * 6;
        const len = 14 + speedFrac * 26 + i * 3;
        ctx.beginPath();
        ctx.moveTo(x + dir * (r + 4), y - r + off);
        ctx.lineTo(x + dir * (r + 4 + len), y - r + off);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Enfueo — ball engulfed in flame while active
    if (effectRemaining.enfueo > 0) {
      const t = performance.now() / 90;
      ctx.save();
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2 + t * 0.3;
        const flick = 0.7 + Math.sin(t + i * 1.7) * 0.3;
        const fx = x + Math.cos(ang) * r * 0.5;
        const fy = y - r + Math.sin(ang) * r * 0.5 - flick * 4;
        const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 9 * flick);
        grad.addColorStop(0, 'rgba(255,230,120,0.9)');
        grad.addColorStop(0.5, 'rgba(255,120,30,0.65)');
        grad.addColorStop(1, 'rgba(255,60,20,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(fx, fy, 9 * flick, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.translate(x, y - r);
    ctx.rotate(ball.rot);
    ctx.fillStyle = '#d81f2f';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    // white stripe band through the middle — rotates with the ball to sell the spin
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-r, -r * 0.32, r * 2, r * 0.64);
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    // shadow
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(x, groundY() + 3, r * 0.9, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
